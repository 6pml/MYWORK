<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>独居动物鉴定所</title>
<link href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    overflow: hidden;
  }

  body {
    font-family: 'ZCOOL KuaiLe', 'Comic Sans MS', cursive, sans-serif;
    background: #6C5CE7;
    display: flex;
    flex-direction: column;
    padding: env(safe-area-inset-top, 20px) 20px env(safe-area-inset-bottom, 20px);
    -webkit-tap-highlight-color: transparent;
    user-select: none;
  }

  /* ===== 顶部区域 ===== */
  .top-bar {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 4px 0;
  }
  .badge {
    background: #FFD93D;
    color: #2D1B4E;
    font-size: 13px;
    padding: 5px 14px;
    border-radius: 20px;
    flex-shrink: 0;
  }
  .progress-text {
    font-size: 12px;
    color: rgba(255,255,255,0.7);
  }

  .q-title {
    font-size: 24px;
    color: #fff;
    padding: 12px 4px 16px;
    line-height: 1.5;
    text-shadow: 0 2px 6px rgba(0,0,0,0.18);
  }

  /* ===== 2x2 选项网格 ===== */
  .options-grid {
    flex: 1;
    display: grid;
    grid-template-columns: 1fr 1fr;
    grid-template-rows: 1fr 1fr;
    gap: 12px;
    padding: 0 0 16px;
  }

  .option {
    border-radius: 20px;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 6px;
    padding: 10px 10px 14px;
    position: relative;
    overflow: hidden;
    transition: transform 0.12s ease, box-shadow 0.15s ease;
    animation: popUp 0.4s ease both;
  }
  .option:nth-child(1) { animation-delay: 0.05s; }
  .option:nth-child(2) { animation-delay: 0.12s; }
  .option:nth-child(3) { animation-delay: 0.19s; }
  .option:nth-child(4) { animation-delay: 0.26s; }

  @keyframes popUp {
    from { opacity: 0; transform: scale(0.92); }
    to   { opacity: 1; transform: scale(1); }
  }

  .option:active {
    transform: scale(0.94);
  }

  /* 各选项背景色 */
  .opt-a { background: #FF6B6B; }
  .opt-b { background: #48DBFB; }
  .opt-c { background: #FFD93D; }
  .opt-d { background: #FF9FF3; }

  /* 选中态 */
  .option.selected {
    box-shadow: 0 0 0 4px #fff, 0 8px 30px rgba(0,0,0,0.25);
    animation: selectBounce 0.35s ease;
  }
  @keyframes selectBounce {
    0%   { transform: scale(1); }
    30%  { transform: scale(0.93); }
    60%  { transform: scale(1.04); }
    100% { transform: scale(1); }
  }

  /* 图片区域 */
  .img-wrap {
    width: 200px;
    height: 200px;
    position: relative;
    flex-shrink: 0;
  }
  .img-wrap img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    position: absolute;
    top: 0; left: 0;
    transition: opacity 0.2s ease;
  }
  /* 默认：静态图可见，动图隐藏 */
  .img-static { opacity: 1; }
  .img-anim   { opacity: 0; }

  /* 选中：静态图隐藏，动图出现 */
  .option.selected .img-static { opacity: 0; }
  .option.selected .img-anim   { opacity: 1; }

  /* 字母标签 */
  .letter-tag {
    font-size: 14px;
    padding: 3px 12px;
    border-radius: 20px;
    background: rgba(255,255,255,0.35);
    color: #fff;
    flex-shrink: 0;
  }
  .option.selected .letter-tag {
    background: #fff;
    color: #333;
  }

  /* 选项文字 */
  .opt-text {
    font-size: 14px;
    color: #fff;
    text-align: center;
    line-height: 1.4;
    padding: 0 4px;
    text-shadow: 0 1px 2px rgba(0,0,0,0.15);
  }

  /* 底部按钮 */
  .nav-row {
    display: flex;
    gap: 12px;
    padding: 8px 4px 12px;
    flex-shrink: 0;
  }
  .btn {
    flex: 1;
    padding: 15px;
    border-radius: 16px;
    border: none;
    font-family: inherit;
    font-size: 17px;
    cursor: pointer;
    transition: transform 0.12s ease, opacity 0.2s;
  }
  .btn:active { transform: scale(0.94); }
  .btn-prev {
    background: rgba(255,255,255,0.18);
    color: #fff;
  }
  .btn-next {
    background: #fff;
    color: #6C5CE7;
    font-weight: bold;
  }
  .btn-next:disabled {
    opacity: 0.35;
    pointer-events: none;
  }
</style>
</head>
<body>

  <div class="top-bar">
    <span class="badge">第 2 / 8 题</span>
    <span class="progress-text">进度 25%</span>
  </div>

  <div class="q-title">
    🌡️ 半夜38.5℃，<br>你的求生欲排在第几位？
  </div>

  <div class="options-grid">
    <!-- A -->
    <div class="option opt-a" data-value="A" onclick="selectOpt(this, 'A')">
      <div class="img-wrap">
        <img class="img-static" src="gif/preview/Heart characters crying.png" alt="">
        <img class="img-anim"   src="gif/Heart characters crying.gif" alt="">
      </div>
      <span class="letter-tag">A</span>
      <span class="opt-text">先发朋友圈："感觉要烧傻了"</span>
    </div>

    <!-- B -->
    <div class="option opt-b" data-value="B" onclick="selectOpt(this, 'B')">
      <div class="img-wrap">
        <img class="img-static" src="gif/preview/Hart express feelings of love.png" alt="">
        <img class="img-anim"   src="gif/Hart express feelings of love.gif" alt="">
      </div>
      <span class="letter-tag">B</span>
      <span class="opt-text">打开美团买药，凑个满减</span>
    </div>

    <!-- C -->
    <div class="option opt-c" data-value="C" onclick="selectOpt(this, 'C')">
      <div class="img-wrap">
        <img class="img-static" src="gif/preview/Heart giving flying kiss.png" alt="">
        <img class="img-anim"   src="gif/Heart giving flying kiss.gif" alt="">
      </div>
      <span class="letter-tag">C</span>
      <span class="opt-text">给闺蜜发消息："来救我"</span>
    </div>

    <!-- D -->
    <div class="option opt-d" data-value="D" onclick="selectOpt(this, 'D')">
      <div class="img-wrap">
        <img class="img-static" src="gif/preview/Heart giving flying kiss.png" alt="">
        <img class="img-anim"   src="gif/Heart giving flying kiss.gif" alt="">
      </div>
      <span class="letter-tag">D</span>
      <span class="opt-text">家里有药箱，退烧贴早就备好</span>
    </div>
  </div>

  <div class="nav-row">
    <button class="btn btn-prev" onclick="goBack()">← 上一题</button>
    <button class="btn btn-next" id="nextBtn" disabled onclick="goNext()">下一题 →</button>
  </div>

<script>
  let picked = null

  function selectOpt(el, val) {
    if (picked === val) return

    // 取消之前的选中
    document.querySelectorAll('.option.selected').forEach(o => o.classList.remove('selected'))

    // 选中当前
    el.classList.add('selected')
    picked = val

    document.getElementById('nextBtn').disabled = false
  }

  function goNext() {
    if (!picked) return
    alert('→ 下一题（演示）\n你选了：' + picked)
    picked = null
    document.querySelectorAll('.option.selected').forEach(o => o.classList.remove('selected'))
    document.getElementById('nextBtn').disabled = true
  }

  function goBack() {
    picked = null
    document.querySelectorAll('.option.selected').forEach(o => o.classList.remove('selected'))
    document.getElementById('nextBtn').disabled = true
  }
</script>
</body>
</html>
