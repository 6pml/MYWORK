<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>独居动物鉴定所</title>
<link href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overflow: hidden; }

body {
  font-family: 'ZCOOL KuaiLe', 'Comic Sans MS', cursive, sans-serif;
  background: oklch(17% 0.02 280);
  color: #fff;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: env(safe-area-inset-top, 40px) 16px env(safe-area-inset-bottom, 40px);
  -webkit-tap-highlight-color: transparent;
  user-select: none;
}

.page {
  display: none;
  flex-direction: column;
  width: 100%;
  max-width: 430px;
  height: 100%;
}
.page.active { display: flex; }

/* ===== Opening Page ===== */
.opening-wrap {
  position: relative;
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  gap: 24px;
  overflow: hidden;
}
.opening-deco {
  position: absolute;
  width: 140px;
  height: 140px;
  pointer-events: none;
  z-index: 0;
}
.opening-deco img { width: 100%; height: 100%; object-fit: contain; }
.opening-deco.tl { top: 8px; left: -12px; animation: floatTL 3s ease-in-out infinite; }
.opening-deco.br { bottom: 8px; right: -12px; animation: floatBR 3.2s ease-in-out infinite; }

@keyframes floatTL {
  0%, 100% { transform: translate(0, 0) rotate(-3deg); }
  50%      { transform: translate(6px, 8px) rotate(0deg); }
}
@keyframes floatBR {
  0%, 100% { transform: translate(0, 0) rotate(3deg); }
  50%      { transform: translate(-6px, -8px) rotate(0deg); }
}

.opening-content { position: relative; z-index: 1; }
.opening-content h1 {
  font-size: clamp(28px, 7vw, 36px);
  letter-spacing: -0.01em;
  text-wrap: balance;
  line-height: 1.3;
}
.opening-content .sub {
  font-size: 15px;
  color: oklch(60% 0.04 65);
  margin-top: 8px;
}
.btn-start {
  position: relative;
  z-index: 1;
  margin-top: 16px;
  padding: 16px 48px;
  border-radius: 50px;
  border: none;
  background: oklch(78% 0.14 85);
  color: oklch(20% 0.02 280);
  font-family: inherit;
  font-size: 20px;
  font-weight: bold;
  cursor: pointer;
  animation: pulse 2s ease-in-out infinite;
  transition: transform 0.12s cubic-bezier(0.25, 1, 0.5, 1);
  box-shadow: 0 0 40px rgba(255, 215, 60, 0.2);
}
.btn-start:active { transform: scale(0.93); }
.btn-start:focus-visible { outline: 2px solid #fff; outline-offset: 4px; }

@keyframes pulse {
  0%, 100% { box-shadow: 0 0 20px rgba(255, 215, 60, 0.15); }
  50%      { box-shadow: 0 0 50px rgba(255, 215, 60, 0.35); }
}

/* ===== Top Bar ===== */
.top-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px 4px 6px;
  flex-shrink: 0;
}
.step-dots { display: flex; gap: 6px; }
.step-dots span {
  width: 8px; height: 8px;
  border-radius: 50%;
  background: oklch(40% 0.01 280);
  transition: background 0.3s, box-shadow 0.3s;
}
.step-dots span.done   { background: oklch(78% 0.14 85); }
.step-dots span.active { background: #fff; box-shadow: 0 0 8px rgba(255,255,255,0.5); }
.counter {
  font-size: 13px;
  color: oklch(60% 0.02 280);
  letter-spacing: 0.5px;
}

/* ===== Question Title ===== */
.q-title {
  font-size: clamp(24px, 5.5vw, 28px);
  font-weight: bold;
  padding: 22px 4px 12px;
  line-height: 1.45;
  text-wrap: balance;
  letter-spacing: -0.01em;
  flex-shrink: 0;
}
.q-title small {
  display: block;
  font-size: 13px;
  color: oklch(55% 0.04 65);
  margin-top: 4px;
  letter-spacing: 0;
}

/* ===== Option Grid ===== */
.option-grid {
  flex: 1;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  padding: 12px 0 8px;
  overflow-y: auto;
  align-content: start;
}

.opt {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 10px;
  padding: 14px 10px;
  border-radius: 18px;
  cursor: pointer;
  outline: none;
  position: relative;
  background: oklch(22% 0.015 280);
  border: 2px solid oklch(28% 0.015 280);
  transition: transform 0.15s cubic-bezier(0.25, 1, 0.5, 1),
              border-color 0.2s,
              background 0.2s,
              box-shadow 0.2s;
  animation: fadeInUp 0.4s cubic-bezier(0.25, 1, 0.5, 1) both;
}
.opt:nth-child(1) { animation-delay: 0.05s; }
.opt:nth-child(2) { animation-delay: 0.12s; }
.opt:nth-child(3) { animation-delay: 0.19s; }
.opt:nth-child(4) { animation-delay: 0.26s; }
.opt:nth-child(5) { animation-delay: 0.33s; }

@keyframes fadeInUp {
  from { opacity: 0; transform: translateY(10px); }
  to   { opacity: 1; transform: translateY(0); }
}

.opt:focus-visible {
  outline: 2px solid oklch(78% 0.14 85);
  outline-offset: 2px;
}
.opt:active {
  transform: scale(0.96);
  transition: transform 0.08s ease;
}

.opt.selected {
  background: oklch(26% 0.025 280);
  border-color: oklch(78% 0.14 85);
  box-shadow: 0 0 0 4px rgba(255, 215, 60, 0.12), 0 0 30px rgba(255, 215, 60, 0.08);
  animation: fadeInUp 0.3s cubic-bezier(0.25, 1, 0.5, 1) both, floatCard 2.8s ease-in-out infinite;
}

@keyframes floatCard {
  0%, 100% { transform: translateY(0); }
  50%      { transform: translateY(-5px); }
}

/* GIF / Preview box */
.opt .gif-box {
  width: 100%;
  aspect-ratio: 1;
  max-width: 130px;
  border-radius: 14px;
  overflow: hidden;
  position: relative;
  background: oklch(20% 0.025 280);
}
.opt .gif-box img {
  width: 100%; height: 100%;
  object-fit: contain;
  position: absolute; top: 0; left: 0;
}
.opt .img-static { opacity: 1; transition: opacity 0.25s cubic-bezier(0.25, 1, 0.5, 1); }
.opt .img-anim   { opacity: 0; transition: opacity 0.25s cubic-bezier(0.25, 1, 0.5, 1); }
.opt.selected .img-static { opacity: 0; }
.opt.selected .img-anim   { opacity: 1; }

.opt .gif-box canvas {
  width: 100%; height: 100%;
  position: absolute; top: 0; left: 0;
  border-radius: 14px;
}

/* ===== Snake Layout (animated Qs) ===== */
.snake-wrap {
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 6px;
  padding: 8px 6px;
  overflow-y: auto;
  justify-content: center;
}
.snake-row {
  display: flex;
  align-items: center;
  gap: 10px;
}
.snake-row.reverse { flex-direction: row-reverse; }

.snake-label {
  flex: 1;
  font-size: 15px;
  color: oklch(55% 0.04 65);
  line-height: 1.35;
  transition: color 0.25s;
}
.snake-row:not(.reverse) .snake-label { text-align: left; }
.snake-row.reverse .snake-label { text-align: right; }
.snake-label.active { color: oklch(78% 0.14 85); font-weight: bold; }

.snake-canvas {
  border-radius: 50%;
  overflow: hidden;
  cursor: pointer;
  background: oklch(22% 0.02 280);
  width: 140px;
  height: 140px;
  flex-shrink: 0;
  transition: box-shadow 0.3s, transform 0.28s cubic-bezier(0.25, 1, 0.5, 1);
  -webkit-tap-highlight-color: transparent;
}
.snake-row:nth-child(1) .snake-canvas { transform: rotate(-3deg); }
.snake-row:nth-child(2) .snake-canvas { transform: rotate(3deg); }
.snake-row:nth-child(3) .snake-canvas { transform: rotate(3deg); }
.snake-row:nth-child(4) .snake-canvas { transform: rotate(-3deg); }

.snake-canvas:active { transform: scale(0.92) rotate(0deg); }
.snake-canvas.selected {
  box-shadow: 0 0 0 3px oklch(78% 0.14 85), 0 0 22px rgba(255,215,60,0.28);
  transform: scale(1.06) rotate(0deg) !important;
  animation: snakeGlow 2.5s ease-in-out infinite;
  z-index: 5;
}
@keyframes snakeGlow {
  0%, 100% { box-shadow: 0 0 0 3px oklch(78% 0.14 85), 0 0 14px rgba(255,215,60,0.18); }
  50%      { box-shadow: 0 0 0 3px oklch(78% 0.14 85), 0 0 32px rgba(255,215,60,0.35); }
}
.snake-canvas canvas { display: block; width: 100%; height: 100%; }

/* Option text */
.opt .opt-label {
  font-size: 13px;
  color: oklch(55% 0.04 65);
  text-align: center;
  line-height: 1.35;
  transition: color 0.2s;
}
.opt.selected .opt-label {
  color: oklch(78% 0.14 85);
  font-weight: bold;
}

/* Multi-select check indicator */
.opt .multi-check {
  position: absolute;
  top: 10px;
  right: 12px;
  width: 22px; height: 22px;
  border-radius: 6px;
  border: 2px solid oklch(35% 0.02 280);
  display: flex;
  align-items: center;
  justify-content: center;
  transition: border-color 0.2s, background 0.2s;
  z-index: 2;
}
.opt.selected .multi-check {
  border-color: oklch(78% 0.14 85);
  background: oklch(78% 0.14 85);
}
.multi-check svg {
  opacity: 0;
  transform: scale(0.5);
  transition: opacity 0.2s, transform 0.25s cubic-bezier(0.25, 1, 0.5, 1);
}
.opt.selected .multi-check svg {
  opacity: 1;
  transform: scale(1);
}

/* E选项 (其他) text input */
.other-input {
  display: none;
  width: 100%;
  margin-top: 6px;
  padding: 8px 12px;
  border-radius: 10px;
  border: 2px solid oklch(35% 0.02 280);
  background: oklch(20% 0.02 280);
  color: #fff;
  font-family: inherit;
  font-size: 14px;
  outline: none;
  transition: border-color 0.2s;
}
.other-input:focus { border-color: oklch(78% 0.14 85); }
.opt.selected .other-input { display: block; }

/* Q7 hint */
.q7-hint {
  text-align: center;
  font-size: 13px;
  color: oklch(55% 0.04 65);
  padding: 4px 0;
  flex-shrink: 0;
}

/* ===== Nav Row ===== */
.nav-row {
  display: flex;
  gap: 12px;
  padding: 12px 0;
  flex-shrink: 0;
}
.btn {
  flex: 1;
  min-height: 50px;
  border-radius: 16px;
  border: none;
  font-family: inherit;
  font-size: 16px;
  cursor: pointer;
  outline: none;
  transition: transform 0.12s cubic-bezier(0.25, 1, 0.5, 1), opacity 0.2s;
}
.btn:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
.btn:active { transform: scale(0.95); }
.btn-prev { background: oklch(28% 0.015 280); color: oklch(70% 0.02 280); }
.btn-next { background: oklch(78% 0.14 85); color: oklch(20% 0.02 280); font-weight: bold; }
.btn-next:disabled { opacity: 0.25; pointer-events: none; }

/* ===== Result Page ===== */
.result-wrap {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  overflow-y: auto;
  padding: 16px 0;
  gap: 14px;
}
.result-gif {
  width: 180px;
  height: 180px;
  flex-shrink: 0;
  animation: resultBounce 0.6s cubic-bezier(0.25, 1, 0.5, 1);
}
@keyframes resultBounce {
  0%   { transform: scale(0.3); opacity: 0; }
  60%  { transform: scale(1.05); }
  100% { transform: scale(1); opacity: 1; }
}
.result-gif img { width: 100%; height: 100%; object-fit: contain; }

.result-title {
  font-size: clamp(24px, 6vw, 30px);
  text-align: center;
  text-wrap: balance;
}
.result-subtitle {
  font-size: 15px;
  color: oklch(60% 0.04 65);
  text-align: center;
}
.result-score {
  font-size: 18px;
  color: oklch(78% 0.14 85);
}

.result-desc {
  font-size: 14px;
  color: oklch(80% 0.02 280);
  line-height: 1.65;
  text-align: left;
  padding: 0 4px;
  text-wrap: pretty;
}
.result-bullets {
  font-size: 13px;
  color: oklch(70% 0.02 280);
  line-height: 1.6;
  padding: 0 4px;
  text-align: left;
  width: 100%;
}
.result-bullets li { margin-bottom: 4px; }
.result-bullets li::marker { color: oklch(78% 0.14 85); }
.result-suggestions {
  font-size: 13px;
  color: oklch(70% 0.02 280);
  line-height: 1.6;
  padding: 0 4px;
  text-align: left;
  width: 100%;
  list-style-type: none;
}
.result-suggestions li {
  padding: 8px 12px;
  margin-bottom: 6px;
  background: oklch(22% 0.015 280);
  border-radius: 12px;
  border: 1px solid oklch(28% 0.015 280);
}
.result-suggestions li span { color: oklch(78% 0.14 85); font-weight: bold; margin-right: 4px; }

/* ===== Survey Page ===== */
.survey-wrap {
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 16px;
  overflow-y: auto;
  padding: 12px 0;
}
.survey-wrap h2 {
  font-size: clamp(22px, 5vw, 26px);
  text-align: center;
  text-wrap: balance;
}
.survey-wrap .survey-sub {
  font-size: 14px;
  color: oklch(60% 0.04 65);
  text-align: center;
}
.survey-field {
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.survey-field label {
  font-size: 15px;
  color: oklch(80% 0.02 280);
}
.chip-group {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}
.chip {
  padding: 8px 16px;
  border-radius: 20px;
  border: 2px solid oklch(35% 0.02 280);
  background: oklch(22% 0.015 280);
  color: oklch(75% 0.02 280);
  font-family: inherit;
  font-size: 14px;
  cursor: pointer;
  transition: border-color 0.2s, background 0.2s, color 0.2s;
}
.chip.selected {
  border-color: oklch(78% 0.14 85);
  background: oklch(26% 0.025 280);
  color: #fff;
}
.survey-input {
  padding: 12px;
  border-radius: 12px;
  border: 2px solid oklch(35% 0.02 280);
  background: oklch(22% 0.015 280);
  color: #fff;
  font-family: inherit;
  font-size: 15px;
  outline: none;
  transition: border-color 0.2s;
}
.survey-input:focus { border-color: oklch(78% 0.14 85); }
.gender-group {
  display: flex;
  gap: 10px;
}
.gender-btn {
  flex: 1;
  padding: 12px;
  border-radius: 12px;
  border: 2px solid oklch(35% 0.02 280);
  background: oklch(22% 0.015 280);
  color: oklch(75% 0.02 280);
  font-family: inherit;
  font-size: 15px;
  cursor: pointer;
  text-align: center;
  transition: border-color 0.2s, background 0.2s, color 0.2s;
}
.gender-btn.selected {
  border-color: oklch(78% 0.14 85);
  background: oklch(26% 0.025 280);
  color: #fff;
}

/* ===== Thanks Page ===== */
.thanks-wrap {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 16px;
  text-align: center;
}
.thanks-icon {
  font-size: 64px;
  animation: resultBounce 0.5s cubic-bezier(0.25, 1, 0.5, 1);
}

/* ===== Toast ===== */
.toast {
  position: fixed;
  top: 20px;
  left: 50%;
  transform: translateX(-50%);
  background: oklch(30% 0.03 15);
  color: #fff;
  padding: 12px 24px;
  border-radius: 12px;
  font-family: inherit;
  font-size: 14px;
  z-index: 100;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.3s;
}

/* ===== Canvas ===== */
#particleCanvas {
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  pointer-events: none;
  z-index: 50;
}

@media (prefers-reduced-motion: reduce) {
  .opt, .opening-deco, .btn-start, .result-gif {
    animation: none !important;
    transition: none !important;
  }
}
</style>
</head>
<body>

<!-- Opening Page -->
<div class="page active" id="page-opening">
  <div class="opening-wrap">
    <div class="opening-deco tl"><img src="gif/opening1.gif" alt=""></div>
    <div class="opening-deco br"><img src="gif/opening2.gif" alt=""></div>
    <div class="opening-content">
      <h1>独居动物<br>鉴定所</h1>
      <p class="sub">3分钟，测测你是哪种"独居神兽"</p>
    </div>
    <button class="btn-start" onclick="startQuiz()">🔍 开始鉴定</button>
  </div>
</div>

<!-- Question Page -->
<div class="page" id="page-question">
  <div class="top-bar">
    <div class="step-dots" id="stepDots"></div>
    <span class="counter" id="counter"></span>
  </div>
  <div class="q-title" id="qTitle"></div>
  <div class="option-grid" id="optionGrid"></div>
  <div class="q7-hint" id="q7Hint" style="display:none">可多选，点击多个选项</div>
  <div class="nav-row">
    <button class="btn btn-prev" id="btnPrev" onclick="goPrev()">← 上一题</button>
    <button class="btn btn-next" id="btnNext" disabled onclick="goNext()">下一题 →</button>
  </div>
</div>

<!-- Result Page -->
<div class="page" id="page-result">
  <div class="top-bar">
    <div class="step-dots" id="resultDots"></div>
    <span class="counter">鉴定完成</span>
  </div>
  <div class="result-wrap" id="resultContent"></div>
  <div class="nav-row">
    <button class="btn btn-prev" onclick="restartQuiz()">🔄 再测一次</button>
    <button class="btn btn-next" onclick="showSurvey()">📝 填写问卷</button>
  </div>
</div>

<!-- Survey Page -->
<div class="page" id="page-survey">
  <div class="top-bar">
    <div class="step-dots" id="surveyDots"></div>
    <span class="counter">可选·匿名</span>
  </div>
  <div class="survey-wrap" id="surveyContent"></div>
  <div class="nav-row">
    <button class="btn btn-prev" onclick="skipSurvey()">跳过</button>
    <button class="btn btn-next" id="btnSubmit" onclick="submitSurvey()">提交</button>
  </div>
</div>

<!-- Thanks Page -->
<div class="page" id="page-thanks">
  <div class="thanks-wrap">
    <div class="result-gif"><img src="gif/end.gif" alt=""></div>
    <h2>感谢你的参与！</h2>
    <p>你的回答已收录。</p>
    <button class="btn-start" style="margin-top:12px;animation:none" onclick="restartQuiz()">🔄 再测一次</button>
  </div>
</div>

<canvas id="particleCanvas"></canvas>
<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
// ===== Supabase Config =====
const SUPABASE_URL = 'https://aojysbbjethuqggvzivi.supabase.co'
const SUPABASE_ANON_KEY = 'YOUR_ANON_KEY_HERE'
let sb = null
try { sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) } catch(e) { console.warn('Supabase init failed') }

// ===== Quiz Data =====
const quizData = {
  questions: [
    {
      title: '以下哪种场景最符合你的"一人食"日常？',
      type: 'single',
      options: [
        { letter: 'A', text: '精致摆盘，拍照发朋友圈配文"仪式感不能少"', score: 3, gif: 'Q1_A.gif', animation: 'Q1_A' },
        { letter: 'B', text: '边吃边刷剧，一顿饭吃两小时', score: 2, gif: 'Q1_B.gif', animation: 'Q1_B' },
        { letter: 'C', text: '站在厨房5分钟就吃完了，碗先泡着', score: 4, gif: 'Q1_C.gif', animation: 'Q1_C' },
        { letter: 'D', text: '打开外卖APP，翻了20分钟还是点了昨天那家', score: 1, gif: 'Q1_D.gif', animation: 'Q1_D' }
      ]
    },
    {
      title: '半夜38.5℃，你的求生欲排在第几位？',
      type: 'single',
      options: [
        { letter: 'A', text: '先发个朋友圈："感觉要烧傻了，有没有人救救我"', score: 1, gif: 'Q2_A.gif', animation: 'Q2_A' },
        { letter: 'B', text: '打开美团买药，顺便凑个满减', score: 3, gif: 'Q2_B.gif', animation: 'Q2_B' },
        { letter: 'C', text: '给闺蜜/兄弟发消息："如果我明天没回消息，来救我"', score: 2, gif: 'Q2_C.gif', animation: 'Q2_C' },
        { letter: 'D', text: '家里有药箱，退烧贴一直在冰箱里等着这一天', score: 4, gif: 'Q2_D.gif', animation: 'Q2_D' }
      ]
    },
    {
      title: '周末早上10点醒来，你的第一念头是？',

function _easeInOutCubic(t) { return t<0.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2; }
function _easeOutBounce(t) { const n1=7.5625,d1=2.75; if(t<1/d1)return n1*t*t; if(t<2/d1)return n1*(t-=1.5/d1)*t+.75; if(t<2.5/d1)return n1*(t-=2.25/d1)*t+.9375; return n1*(t-=2.625/d1)*t+.984375; }

  Q5_B: { duration:4500, drawStatic(ctx,w,h){ this.drawFrame(ctx,w,h,1600); },
    drawFrame(ctx,w,h,t){ const tt=t,cx=w/2,cy=h/2;
      ctx.clearRect(0,0,w,h);
      ctx.fillStyle='#1e1b2e'; ctx.fillRect(0,0,w,h);
      // spotlight cone
      const sg=ctx.createLinearGradient(0,0,0,h);
      sg.addColorStop(0,'rgba(255,240,210,0.12)'); sg.addColorStop(0.5,'rgba(255,240,210,0.03)'); sg.addColorStop(1,'rgba(0,0,0,0)');
      ctx.fillStyle=sg; ctx.fillRect(0,0,w,h);
      // stage floor
      ctx.fillStyle='#2a1f18'; ctx.fillRect(0,h*0.78,w,h*0.22);
      ctx.fillStyle='#5c3d2e'; ctx.fillRect(0,h*0.78,w,2.5);
      // ---- figure ----
      const fx=cx, fyBase=h*0.68;
      const bob=Math.sin(tt*0.004)*1.5;
      // shadow
      ctx.fillStyle='rgba(0,0,0,0.3)'; ctx.beginPath(); ctx.ellipse(fx,fyBase+4,14,4,0,0,Math.PI*2); ctx.fill();
      // legs
      ctx.strokeStyle='#d4b896'; ctx.lineWidth=3; ctx.lineCap='round';
      ctx.beginPath(); ctx.moveTo(fx-5,fyBase-16); ctx.lineTo(fx-7,fyBase+bob); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(fx+5,fyBase-16); ctx.lineTo(fx+7,fyBase+bob); ctx.stroke();
      // body - green t-shirt
      ctx.fillStyle='#5cb85c'; _R(ctx,fx-13,fyBase-40+bob,26,27,6); ctx.fill();
      // collar
      ctx.fillStyle='#4a9e4a'; ctx.beginPath(); ctx.moveTo(fx-7,fyBase-40+bob); ctx.lineTo(fx,fyBase-33+bob); ctx.lineTo(fx+7,fyBase-40+bob); ctx.fill();
      // head
      ctx.fillStyle='#fdd'; ctx.beginPath(); ctx.arc(fx,fyBase-48+bob,11,0,Math.PI*2); ctx.fill();
      // eyes - skeptical squint
      ctx.fillStyle='#333';
      ctx.beginPath(); ctx.arc(fx-4,fyBase-50+bob,1.8,0,Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(fx+4,fyBase-50+bob,1.8,0,Math.PI*2); ctx.fill();
      // mouth - unimpressed
      ctx.strokeStyle='#333'; ctx.lineWidth=1.2; ctx.beginPath(); ctx.arc(fx,fyBase-44+bob,3.5,0.4,Math.PI-0.4); ctx.stroke();
      // arms
      ctx.strokeStyle='#d4b896'; ctx.lineWidth=2.8; ctx.lineCap='round';
      ctx.beginPath(); ctx.moveTo(fx-13,fyBase-32+bob); ctx.lineTo(fx-19,fyBase-20+Math.sin(tt*0.005)*3+bob); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(fx+13,fyBase-32+bob); ctx.lineTo(fx+19,fyBase-20+Math.cos(tt*0.005)*3+bob); ctx.stroke();
      // ---- phase 1: magnifying glass sweeps in (600ms) ----
_snd("whoosh",tt-1000);

      if(tt>600){
        const mp=Math.min(1,(tt-600)/450), ms=_easeOutBack(mp);
        const mgX=fx-w*0.35+ms*(fx-w*0.08), mgY=h*0.2;
        ctx.strokeStyle='#b5651d'; ctx.lineWidth=2.5; ctx.lineCap='round';
        ctx.beginPath(); ctx.moveTo(mgX+8,mgY+8); ctx.lineTo(mgX+15,mgY+15); ctx.stroke();
        ctx.strokeStyle='#ddd'; ctx.lineWidth=2; ctx.beginPath(); ctx.arc(mgX,mgY,10,0,Math.PI*2); ctx.stroke();
        ctx.fillStyle='rgba(180,210,255,0.25)'; ctx.fill();
        // lens glint
        ctx.fillStyle='rgba(255,255,255,0.5)'; ctx.beginPath(); ctx.arc(mgX-2,mgY-3,3,0,Math.PI*2); ctx.fill();
      }
      // ---- phase 2: scanning beam (1300ms) ----
      if(tt>1300&&tt<2500){
        const sp=(tt-1300)/1200, sweepX=fx-w*0.2+sp*w*0.4, sweepY=fyBase-45+Math.sin(sp*Math.PI)*18;
        ctx.strokeStyle='rgba(255,255,200,0.5)'; ctx.lineWidth=3; ctx.beginPath(); ctx.arc(sweepX,sweepY,11,0,Math.PI*2); ctx.stroke();
        ctx.fillStyle='rgba(255,255,200,0.08)'; ctx.fill();
        // little inspection dots
        for(let i=0;i<4;i++){
          const dp=sp+i*0.1; if(dp>0&&dp<1){
            const dx=fx-w*0.2+dp*w*0.45, dy=fyBase-45+Math.sin(dp*Math.PI)*18;
            ctx.fillStyle=`rgba(255,255,200,${0.6*(1-Math.abs(sp-dp+0.1))})`; ctx.beginPath(); ctx.arc(dx,dy,1.5,0,Math.PI*2); ctx.fill();
          }
        }
      }
      // ---- phase 3: star ratings appear one by one, all empty (1800ms) ----
      if(tt>1800){
        for(let s=0;s<5;s++){
          const sd=1800+s*200; if(tt>sd){
            const sp=Math.min(1,(tt-sd)/350), ss=_easeOutBack(sp);
            const sx=cx-w*0.28+s*w*0.14, sy=h*0.12;
            ctx.fillStyle=`rgba(180,180,180,${ss*0.8})`;
            ctx.font=`${w*0.08}px sans-serif`; ctx.textAlign='center'; ctx.fillText('☆',sx,sy);
          }
        }
      }
      // ---- phase 4: giant X stamp (2600ms) ----
      if(tt>2600){
        const xp=Math.min(1,(tt-2600)/300), xs=_easeOutBack(xp);
        const xX=cx+w*0.15, xY=fyBase-55;
        ctx.save(); ctx.translate(xX,xY); ctx.rotate(-0.25);
        ctx.strokeStyle='#ff3b3b'; ctx.lineWidth=5*xs; ctx.lineCap='round';
        ctx.beginPath(); ctx.moveTo(-10*xs,-10*xs); ctx.lineTo(10*xs,10*xs); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(10*xs,-10*xs); ctx.lineTo(-10*xs,10*xs); ctx.stroke();
        // stamp text
        if(xp>0.4){
          const sa=(xp-0.4)/0.6;
          ctx.fillStyle=`rgba(255,50,50,${sa*0.9})`; ctx.font=`bold ${w*0.07}px sans-serif`; ctx.textAlign='center';
          ctx.fillText('不行!',0,16);

        _snd("drop",tt-2500);
        }
        ctx.restore();
      }
      // ---- phase 5: figure shrinks & exits right (3000ms) ----
      if(tt>3000){
        const ep=Math.min(1,(tt-3000)/500), es=_easeInOutCubic(ep);
        const ex=fx+es*w*0.55, ey=fyBase+es*5;
        const sh=1-es*0.35;
        ctx.save(); ctx.globalAlpha=1-es;
        ctx.fillStyle='#888'; ctx.beginPath(); ctx.arc(ex,ey-35*sh,10*sh,0,Math.PI*2); ctx.fill();
        ctx.fillStyle='#999'; _R(ctx,ex-10*sh,ey-28*sh,20*sh,22*sh,5); ctx.fill();
        ctx.restore();
      }
      // ---- phase 6: "下一个!" appears (3400ms) ----
_snd("pop",tt-3500);

      if(tt>3400){
        const np=Math.min(1,(tt-3400)/500), ns=_easeOutBack(np);
        ctx.fillStyle=`rgba(255,215,60,${ns})`; ctx.font=`bold ${w*0.09}px sans-serif`; ctx.textAlign='center';
        ctx.fillText('下一个!',cx,h*0.38);
        // new figure peeking from left
        if(ns>0.3){
          const pk=(ns-0.3)/0.7, pkX=cx-w*0.32+(1-pk)*w*0.18;
          ctx.fillStyle='#fdd'; ctx.beginPath(); ctx.arc(pkX,h*0.5,8,0,Math.PI*2); ctx.fill();
          // sparkle eyes
          ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(pkX-2,h*0.49,1.5,0,Math.PI*2); ctx.fill();
          ctx.beginPath(); ctx.arc(pkX+2,h*0.49,1.5,0,Math.PI*2); ctx.fill();
          // sparkles around
          for(let i=0;i<5;i++){
            const sr=(tt*0.008+i*1.2)%3; if(sr<2){
              const sx=pkX+Math.cos(i*1.3)*12, sy=h*0.5-sr*8+Math.sin(i)*6;
              ctx.fillStyle=`rgba(255,255,200,${0.7*(1-sr/2)})`; ctx.font=`${w*0.05}px sans-serif`; ctx.textAlign='center';
              ctx.fillText('✨',sx,sy);
            }
          }
        }
      }

  ctx.bezierCurveTo(x,y,x-s/2,y-t,x-s/2,y); ctx.bezierCurveTo(x-s/2,y+t,x,y+t*3,x,y+s);
  ctx.bezierCurveTo(x,y+t*3,x+s/2,y+t,x+s/2,y); ctx.bezierCurveTo(x+s/2,y-t,x,y,x,y+t);
  ctx.fill();
}

// Audio context (lazy init)
let _audioCtx = null;

  if (_audioCtx && _audioCtx.state === 'suspended') { _audioCtx.resume(); }
  return _audioCtx;
}
function _playSound(type, vol) {
  const ac = _getAudio();
  if (!ac) return;
  const v = vol || 0.08;
  const now = ac.currentTime;
  const g = ac.createGain();
  g.connect(ac.destination);
  g.gain.setValueAtTime(v, now);
  if (type === 'tap') {
    const o = ac.createOscillator();
    o.type = 'sine'; o.frequency.setValueAtTime(1800, now); o.frequency.exponentialRampToValueAtTime(800, now+0.05);
    o.connect(g); g.gain.exponentialRampToValueAtTime(0.001, now+0.06);
    o.start(now); o.stop(now+0.06);
  } else if (type === 'ding') {
    [1200,1600].forEach((f,i) => {
      const o = ac.createOscillator();
      o.type = 'sine'; o.frequency.setValueAtTime(f, now+i*0.06);
      o.connect(g); g.gain.setValueAtTime(v, now+i*0.06); g.gain.exponentialRampToValueAtTime(0.001, now+i*0.06+0.12);
      o.start(now+i*0.06); o.stop(now+i*0.06+0.12);

  } else if (type === 'drop') {
    const o = ac.createOscillator();
    o.type = 'triangle'; o.frequency.setValueAtTime(300, now); o.frequency.exponentialRampToValueAtTime(60, now+0.12);
    o.connect(g); g.gain.exponentialRampToValueAtTime(0.001, now+0.15);
    o.start(now); o.stop(now+0.15);
  } else if (type === 'success') {
    [523,659,784].forEach((f,i) => {
      const o = ac.createOscillator();
      o.type = 'sine'; o.frequency.setValueAtTime(f, now+i*0.1);
      o.connect(g); g.gain.setValueAtTime(v, now+i*0.1); g.gain.exponentialRampToValueAtTime(0.001, now+i*0.1+0.2);
      o.start(now+i*0.1); o.stop(now+i*0.1+0.2);
    });
    g.gain.exponentialRampToValueAtTime(0.001, now+0.55);
  } else if (type === 'whoosh') {
    const b = ac.createBuffer(1, ac.sampleRate*0.15, ac.sampleRate);
    const d = b.getChannelData(0);
    for (let i=0;i<d.length;i++) { d[i] = (Math.random()*2-1) * (1-i/d.length); }
    const s = ac.createBufferSource(); s.buffer = b;
    const f = ac.createBiquadFilter(); f.type = 'bandpass'; f.frequency.setValueAtTime(800, now); f.frequency.exponentialRampToValueAtTime(200, now+0.15);
    s.connect(f); f.connect(g);
    g.gain.setValueAtTime(v*0.5, now); g.gain.exponentialRampToValueAtTime(0.001, now+0.18);
    s.start(now); s.stop(now+0.18);
  } else if (type === 'pop') {
    const o = ac.createOscillator();
    o.type = 'sine'; o.frequency.setValueAtTime(600, now); o.frequency.exponentialRampToValueAtTime(200, now+0.04);
    o.connect(g); g.gain.exponentialRampToValueAtTime(0.001, now+0.05);
    o.start(now); o.stop(now+0.05);
  } else if (type === 'msg') {
    [800,1000].forEach((f,i) => {
      const o = ac.createOscillator();
      o.type = 'sine'; o.frequency.setValueAtTime(f, now+i*0.08);
      o.connect(g); g.gain.setValueAtTime(v, now+i*0.08); g.gain.exponentialRampToValueAtTime(0.001, now+i*0.08+0.06);
      o.start(now+i*0.08); o.stop(now+i*0.08+0.06);

function _snd(name, t) {
  if (!_sndCanvas) return;
  const key = _sndCanvas._animKey + '__' + name;
  if (!_sndCanvas._sf) _sndCanvas._sf = new Set();
  if (!_sndCanvas._sf.has(key) && t >= 0) { _sndCanvas._sf.add(key); _playSound(name); }
}
let _sndCanvas = null;

// Active animation tracking
const _activeAnims = new Map(); // canvas -> rafId

function _initCanvas(canvas, animKey) {
  const def = ANIM[animKey];
  if (!def) return;
  const dpr = Math.min(window.devicePixelRatio||1, 2);
  const rect = canvas.parentElement.getBoundingClientRect();
  const size = rect.width || 130;
  canvas.width = canvas.height = size * dpr;
  canvas.style.width = canvas.style.height = '100%';
  const ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);
  def.drawStatic(ctx, size, size);
  canvas._animKey = animKey;
  canvas._size = size;
  canvas._dpr = dpr;
}

function _startAnim(canvas) {
  const def = ANIM[canvas._animKey];
  if (!def) return;
  _stopAnim(canvas);
  canvas._sf = new Set();
  const ctx = canvas.getContext('2d');
  const size = canvas._size;
  let start = null;
  function frame(ts) {
    if (start === null) start = ts;
    const elapsed = ts - start;
    _sndCanvas = canvas;
    ctx.save();
    ctx.setTransform(canvas._dpr||1, 0, 0, canvas._dpr||1, 0, 0);
    def.drawFrame(ctx, size, size, elapsed % def.duration);
    ctx.restore();
    _sndCanvas = null;
    canvas._rafId = requestAnimationFrame(frame);
  }
  canvas._rafId = requestAnimationFrame(frame);
  _activeAnims.set(canvas, canvas._rafId);
}

function _stopAnim(canvas) {
  if (canvas._rafId) { cancelAnimationFrame(canvas._rafId); canvas._rafId = null; }
  _activeAnims.delete(canvas);
  const def = ANIM[canvas._animKey];
  if (def) {
    const ctx = canvas.getContext('2d');
    ctx.save();
    ctx.setTransform(canvas._dpr||1, 0, 0, canvas._dpr||1, 0, 0);
    def.drawStatic(ctx, canvas._size, canvas._size);
    ctx.restore();
  }
}

// ===== Particle Canvas =====
const canvas = document.getElementById('particleCanvas')
const ctx = canvas.getContext('2d')
let particles = []
let animId = null
let ambientInterval = null
let meteorInterval = null

function resizeCanvas() {
  canvas.width = window.innerWidth
  canvas.height = window.innerHeight
}

// ===== Opening Page Ambient Particles =====
function startAmbientParticles() {
  if (ambientInterval) return
  spawnAmbientBatch()
  ambientInterval = setInterval(spawnAmbientBatch, 400)
  spawnMeteor()
  meteorInterval = setInterval(() => {
    for (let i = 0; i < 20; i++) { setTimeout(() => spawnMeteor(), i * 40) }
  }, 1000)
}

function stopAmbientParticles() {
  if (ambientInterval) { clearInterval(ambientInterval); ambientInterval = null }
  if (meteorInterval) { clearInterval(meteorInterval); meteorInterval = null }
  particles = particles.filter(p => !p.ambient)
}

function spawnAmbientBatch() {
  const w = canvas.width
  const h = canvas.height
  for (let i = 0; i < 3; i++) {
    particles.push({
      x: Math.random() * w,
      y: h + 10,
      vx: (Math.random() - 0.5) * 0.4,
      vy: -(0.3 + Math.random() * 0.7),
      life: 1,
      decay: 0.003 + Math.random() * 0.005,
      size: 1.5 + Math.random() * 2.5,
      color: Math.random() < 0.5 ? 'oklch(78% 0.14 85 / 0.7)' : 'oklch(90% 0.01 100 / 0.5)',
      ambient: true
    })
  }
  if (!animId) animateParticles()
}

// ===== Meteor (shooting star) =====
function drawStar(ctx, x, y, outerR, innerR, points) {
  ctx.beginPath()
  for (let i = 0; i < points * 2; i++) {
    const r = i % 2 === 0 ? outerR : innerR
    const angle = (Math.PI * i) / points - Math.PI / 2
    const px = x + Math.cos(angle) * r
    const py = y + Math.sin(angle) * r
    if (i === 0) ctx.moveTo(px, py)
    else ctx.lineTo(px, py)
  }
  ctx.closePath()
  ctx.fill()
}

function spawnMeteor() {
  const w = canvas.width
  const h = canvas.height
  const startX = w * (0.05 + Math.random() * 0.9)
  const startY = h * (0.01 + Math.random() * 0.18)
  const angle = Math.PI * 0.3 + Math.random() * 0.2
  const speed = 1.2 + Math.random() * 2
  const vx = -Math.cos(angle) * speed
  const vy = Math.sin(angle) * speed
  const headSize = 3 + Math.random() * 5
  // Head: star shape
  particles.push({
    x: startX, y: startY, vx, vy,
    life: 1, decay: 0.005 + Math.random() * 0.006,
    size: headSize, innerRatio: 0.4 + Math.random() * 0.2,
    color: 'oklch(95% 0.02 100 / 0.95)',
    ambient: true, meteor: true, shape: 'star'
  })
  // Tail dots
  const tailLen = 5 + Math.floor(Math.random() * 6)
  for (let i = 1; i <= tailLen; i++) {
    const t = i / tailLen
    particles.push({
      x: startX + vx * t * 1.6,
      y: startY + vy * t * 1.6,
      vx, vy,
      life: 1 - t * 0.5,
      decay: 0.005 + Math.random() * 0.006,
      size: (headSize * 0.7 - t * headSize * 0.13) + Math.random() * 0.8,
      color: `oklch(78% 0.14 85 / ${(0.7 - t * 0.6).toFixed(2)})`,
      ambient: true, meteor: true
    })
  }
  if (!animId) animateParticles()
}

const palettes = [
  ['#FF6B6B', '#FF8E8E', '#FFD93D', '#FF6B9D'],
  ['#4ECDC4', '#6EE7DE', '#45B7D1', '#96E6A1'],
  ['#A78BFA', '#C4B5FD', '#8B5CF6', '#DDD6FE'],
  ['#F59E0B', '#FBBF24', '#FCD34D', '#FDE68A']
]

function burstParticles(x, y) {
  const palette = palettes[Math.floor(Math.random() * palettes.length)]
  for (let i = 0; i < 36; i++) {
    const angle = (Math.PI * 2 * i) / 36 + (Math.random() - 0.5) * 0.3
    const speed = 2 + Math.random() * 6
    particles.push({
      x, y,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      life: 1,
      decay: 0.015 + Math.random() * 0.025,
      size: 2 + Math.random() * 4,
      color: palette[Math.floor(Math.random() * palette.length)]
    })
  }
  if (!animId) animateParticles()
}

function animateParticles() {
  ctx.clearRect(0, 0, canvas.width, canvas.height)
  particles = particles.filter(p => p.life > 0)
  for (const p of particles) {
    p.x += p.vx
    p.y += p.vy
    if (!p.ambient) p.vy += 0.06
    p.life -= p.decay
    ctx.globalAlpha = p.life
    ctx.fillStyle = p.color
    if (p.shape === 'star') {
      drawStar(ctx, p.x, p.y, p.size, p.size * (p.innerRatio || 0.4), 5)
    } else {
      ctx.beginPath()
      ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2)
      ctx.fill()
    }
  }
  ctx.globalAlpha = 1
  if (particles.length > 0) {
    animId = requestAnimationFrame(animateParticles)
  } else {
    animId = null
    ctx.clearRect(0, 0, canvas.width, canvas.height)
  }
}

// ===== Start Quiz =====
function startQuiz() {
  currentQ = 0
  answers = new Array(quizData.questions.length).fill(null)
  totalScore = 0
  resultType = null
  renderQuestion()
  showPage('page-question')
}

// ===== Render Question =====
function renderQuestion() {
  // Stop all running canvas animations
  _activeAnims.forEach((_, cvs) => _stopAnim(cvs));

  const q = quizData.questions[currentQ]
  const total = quizData.questions.length

  let dotsHTML = ''
  for (let i = 0; i < total; i++) {
    let cls = ''
    if (answers[i] !== null) cls = 'done'
    if (i === currentQ) cls = 'active'
    dotsHTML += `<span class="${cls}"></span>`
  }
  document.getElementById('stepDots').innerHTML = dotsHTML
  document.getElementById('counter').textContent = `第 ${currentQ + 1} 题 / 共 ${total} 题`

  const isMulti = q.type === 'multi'
  document.getElementById('qTitle').innerHTML = q.title + (isMulti ? '<small>可多选</small>' : '')

  const grid = document.getElementById('optionGrid')

  // Check if this question uses bold canvas layout
  const useBold = !isMulti && !q.hasOther && q.options[0].animation && ANIM[q.options[0].animation];

  if (useBold) {
    grid.className = 'snake-wrap'
    // Snake: A=canvas左文字右, B=文字左canvas右, C=canvas左文字右, D=文字左canvas右
    const rows = q.options.map((opt, i) => {
      const rev = (i % 2 === 1) ? ' reverse' : '';
      const canvasHTML = `<div class="snake-canvas" data-letter="${opt.letter}" data-idx="${i}" onclick="selectSnakeOpt(this)" tabindex="0">
        <canvas data-anim="${opt.animation}"></canvas>
      </div>`;
      const labelHTML = `<div class="snake-label" data-letter="${opt.letter}">选项${opt.letter} · ${opt.text}</div>`;
      return `<div class="snake-row${rev}">${canvasHTML}${labelHTML}</div>`;
    }).join('')
    grid.innerHTML = rows

    // Init canvases
    grid.querySelectorAll('canvas').forEach(c => _initCanvas(c, c.dataset.anim))

    // Restore previous answer
    const prev = answers[currentQ]
    if (prev && prev.letter) {
      const item = grid.querySelector(`.snake-canvas[data-letter="${prev.letter}"]`)
      if (item) {
        item.classList.add('selected')
        const cvs = item.querySelector('canvas')
        if (cvs) _startAnim(cvs)
        const label = grid.querySelector(`.snake-label[data-letter="${prev.letter}"]`)
        if (label) label.classList.add('active')
      }
    }

    document.getElementById('q7Hint').style.display = 'none'
    updateNavButtons()
    return
  }

  grid.className = 'option-grid' + (q.hasOther ? ' has-extra' : '')

  let html = ''
  q.options.forEach((opt, idx) => {
    const hasAnim = opt.animation && ANIM[opt.animation];
    html += `
    <div class="opt" data-idx="${idx}" data-letter="${opt.letter}" onclick="selectOpt(this, ${idx})" tabindex="0">
      ${isMulti ? `<span class="multi-check"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="oklch(20% 0.02 280)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></span>` : ''}
      ${hasAnim ? `
      <div class="gif-box">
        <canvas class="anim-canvas" data-anim="${opt.animation}"></canvas>
      </div>` : opt.gif ? `
      <div class="gif-box">
        <img class="img-static" src="gif/preview/${opt.gif.replace('.gif','.png')}" alt="">
        <img class="img-anim" src="gif/${opt.gif}" alt="">
      </div>` : `<div class="gif-box" style="display:flex;align-items:center;justify-content:center;font-size:36px">✏️</div>`}
      <div class="opt-label">选项 ${opt.letter} · ${opt.text}</div>
      ${opt.isOther ? `<input class="other-input" type="text" placeholder="请填写..." onclick="event.stopPropagation()">` : ''}
    </div>`
  })
  grid.innerHTML = html

  // Init canvas animations
  grid.querySelectorAll('.anim-canvas').forEach(c => _initCanvas(c, c.dataset.anim))

  document.getElementById('q7Hint').style.display = isMulti ? 'block' : 'none'

  // Restore previous answer
  const prev = answers[currentQ]
  if (prev !== null) {
    if (isMulti && prev.letters) {
      prev.letters.forEach(l => {
        const card = grid.querySelector(`[data-letter="${l}"]`)
        if (card) {
          card.classList.add('selected')
          const cvs = card.querySelector('.anim-canvas')
          if (cvs) _startAnim(cvs)
          if (l === 'E' && prev.otherText) {
            const inp = card.querySelector('.other-input')
            if (inp) inp.value = prev.otherText
          }
        }
      })
    } else if (!isMulti && prev.letter) {
      const card = grid.querySelector(`[data-letter="${prev.letter}"]`)
      if (card) {
        card.classList.add('selected')
        const cvs = card.querySelector('.anim-canvas')
        if (cvs) _startAnim(cvs)
        if (prev.otherText) {
          const inp = card.querySelector('.other-input')
          if (inp) inp.value = prev.otherText
        }
      }
    }
  }

  updateNavButtons()
}

// ===== Select Option =====
function selectOpt(el, idx) {
  const q = quizData.questions[currentQ]
  const grid = document.getElementById('optionGrid')
  const isMulti = q.type === 'multi'

  if (isMulti) {
    el.classList.toggle('selected')
    const cvs = el.querySelector('.anim-canvas')
    if (el.classList.contains('selected')) {
      if (cvs) _startAnim(cvs)
      const rect = el.getBoundingClientRect()
      burstParticles(rect.left + rect.width / 2, rect.top + rect.height / 2)
    } else {
      if (cvs) _stopAnim(cvs)
    }
  } else {
    if (el.classList.contains('selected')) return
    grid.querySelectorAll('.opt.selected').forEach(c => {
      c.classList.remove('selected')
      const cvs = c.querySelector('.anim-canvas')
      if (cvs) _stopAnim(cvs)
    })
    el.classList.add('selected')
    const cvs = el.querySelector('.anim-canvas')
    if (cvs) _startAnim(cvs)
    const rect = el.getBoundingClientRect()
    burstParticles(rect.left + rect.width / 2, rect.top + rect.height / 2)
  }

  saveCurrentAnswer()
  updateNavButtons()
}

function selectSnakeOpt(el) {
  const wrap = el.closest('.snake-wrap');
  if (!wrap) return;

  // Deselect all
  wrap.querySelectorAll('.snake-canvas.selected').forEach(c => {
    if (c !== el) {
      c.classList.remove('selected');
      const cvs = c.querySelector('canvas');
      if (cvs) _stopAnim(cvs);
    }
  });

  // Toggle current
  if (el.classList.contains('selected')) {
    el.classList.remove('selected');
    const cvs = el.querySelector('canvas');
    if (cvs) _stopAnim(cvs);
  } else {
    el.classList.add('selected');
    const cvs = el.querySelector('canvas');
    if (cvs) _startAnim(cvs);
    const rect = el.getBoundingClientRect();
    burstParticles(rect.left + rect.width / 2, rect.top + rect.height / 2);
  }

  // Sync labels
  const sel = wrap.querySelector('.snake-canvas.selected');
  wrap.querySelectorAll('.snake-label').forEach(l => {
    l.classList.toggle('active', sel && l.dataset.letter === sel.dataset.letter);
  });

  saveCurrentAnswer();
  updateNavButtons();
}

function saveCurrentAnswer() {
  const q = quizData.questions[currentQ]
  const grid = document.getElementById('optionGrid')

  // Snake layout
  if (grid.classList.contains('snake-wrap')) {
    const sel = grid.querySelector('.snake-canvas.selected');
    if (!sel) { answers[currentQ] = null; return; }
    const l = sel.dataset.letter;
    const opt = q.options.find(o => o.letter === l);
    answers[currentQ] = { letter: l, score: opt ? opt.score : 0 };
    return;
  }

  const selected = grid.querySelectorAll('.opt.selected')

  if (q.type === 'multi') {
    const letters = []
    const scores = []
    let otherText = ''
    selected.forEach(c => {
      const l = c.dataset.letter
      letters.push(l)
      const opt = q.options.find(o => o.letter === l)
      if (opt && !opt.isOther) scores.push(opt.score)
      if (opt && opt.isOther) {
        const inp = c.querySelector('.other-input')
        if (inp) otherText = inp.value
      }
    })
    answers[currentQ] = { letters, scores, otherText }
  } else {
    if (selected.length === 0) {
      answers[currentQ] = null
      return
    }
    const c = selected[0]
    const l = c.dataset.letter
    const opt = q.options.find(o => o.letter === l)
    let otherText = ''
    if (opt && opt.isOther) {
      const inp = c.querySelector('.other-input')
      if (inp) otherText = inp.value
    }
    answers[currentQ] = { letter: l, score: opt ? opt.score : 0, otherText }
  }
}

function updateNavButtons() {
  const ans = answers[currentQ]
  const isMulti = quizData.questions[currentQ].type === 'multi'
  const hasSelection = isMulti
    ? (ans !== null && ans.letters && ans.letters.length > 0)
    : (ans !== null && ans.letter)
  document.getElementById('btnNext').disabled = !hasSelection

  if (currentQ === quizData.questions.length - 1) {
    document.getElementById('btnNext').textContent = '看结果 →'
  } else {
    document.getElementById('btnNext').textContent = '下一题 →'
  }
}

// ===== Navigation =====
function goPrev() {
  saveCurrentAnswer()
  if (currentQ > 0) {
    currentQ--
    renderQuestion()
  } else {
    showPage('page-opening')
  }
}

function goNext() {
  saveCurrentAnswer()
  if (currentQ < quizData.questions.length - 1) {
    currentQ++
    renderQuestion()
  } else {
    calcResult()
    renderResult()
    showPage('page-result')
  }
}

// ===== Scoring =====
function calcResult() {
  totalScore = 0
  for (const ans of answers) {
    if (!ans) continue
    if (ans.scores) {
      totalScore += ans.scores.reduce((a, b) => a + b, 0)
    } else if (ans.score) {
      totalScore += ans.score
    }
  }

  if (totalScore >= 32) resultType = 'A'
  else if (totalScore >= 24) resultType = 'B'
  else if (totalScore >= 16) resultType = 'C'
  else resultType = 'D'
}

// ===== Render Result =====
function renderResult() {
  const r = quizData.results[resultType]
  document.getElementById('resultContent').innerHTML = `
    <div class="result-gif"><img src="gif/${r.gif}" alt=""></div>
    <div class="result-title">${r.emoji} ${r.title}</div>
    <div class="result-subtitle">${r.subtitle}</div>
    <div class="result-score">得分：${totalScore} 分（满分 40）</div>
    <div class="result-desc">${r.desc}</div>
    <div style="font-size:14px;color:oklch(78% 0.14 85);padding:0 4px;width:100%">隐藏耗损：</div>
    <ul class="result-bullets">${r.bullets.map(b => `<li>${b}</li>`).join('')}</ul>
    <div style="font-size:14px;color:oklch(78% 0.14 85);padding:0 4px;width:100%">给你的3个小建议：</div>
    <ol class="result-suggestions">${r.suggestions.map((s, i) => `<li><span>${i+1}.</span>${s}</li>`).join('')}</ol>
    <div style="font-size:13px;color:oklch(60% 0.04 65);text-align:center;padding:6px 0">${r.note}</div>
  `

  let dotsHTML = ''
  for (let i = 0; i < quizData.questions.length; i++) dotsHTML += '<span class="done"></span>'
  document.getElementById('resultDots').innerHTML = dotsHTML
}

function restartQuiz() {
  currentQ = 0
  answers = new Array(quizData.questions.length).fill(null)
  totalScore = 0
  resultType = null
  surveyAge = null
  surveyCity = ''
  surveyGender = null
  document.getElementById('btnNext').textContent = '下一题 →'
  showPage('page-opening')
}

// ===== Survey =====
function showSurvey() {
  let dotsHTML = ''
  for (let i = 0; i < 8; i++) dotsHTML += '<span class="done"></span>'
  document.getElementById('surveyDots').innerHTML = dotsHTML

  document.getElementById('surveyContent').innerHTML = `
    <h2>感谢你完成测试！</h2>
    <p class="survey-sub">我们正在研究独居人群的生活状态，你的回答会帮助我们更好地理解这个群体。<br>（全部选填，匿名）</p>
    <div class="survey-field">
      <label>你的年龄</label>
      <div class="chip-group" id="ageGroup">
        ${['25-30','31-35','36-40','41-45','46-50','50+'].map(a => `<span class="chip" data-val="${a}" onclick="selectChip(this,'age')">${a}</span>`).join('')}
      </div>
    </div>
    <div class="survey-field">
      <label>你的城市</label>
      <input class="survey-input" type="text" id="cityInput" placeholder="如：北京" value="${escapeHtml(surveyCity)}" oninput="surveyCity=this.value">
    </div>
    <div class="survey-field">
      <label>你是男生还是女生</label>
      <div class="gender-group" id="genderGroup">
        <span class="gender-btn" data-val="男" onclick="selectGender(this)">🙋‍♂️ 男生</span>
        <span class="gender-btn" data-val="女" onclick="selectGender(this)">🙋‍♀️ 女生</span>
      </div>
    </div>
  `
  showPage('page-survey')
}

function escapeHtml(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;') }

function selectChip(el) {
  el.parentElement.querySelectorAll('.chip').forEach(c => c.classList.remove('selected'))
  el.classList.add('selected')
  surveyAge = el.dataset.val
}

function selectGender(el) {
  document.querySelectorAll('.gender-btn').forEach(b => b.classList.remove('selected'))
  el.classList.add('selected')
  surveyGender = el.dataset.val
}

function skipSurvey() { showPage('page-result') }

async function submitSurvey() {
  const btn = document.getElementById('btnSubmit')
  btn.disabled = true
  btn.textContent = '提交中...'

  const payload = {
    answers: answers,
    total_score: totalScore,
    result_type: resultType,
    result_title: quizData.results[resultType].title,
    age: surveyAge || null,
    city: surveyCity || null,
    gender: surveyGender || null,
    created_at: new Date().toISOString()
  }

  let submitted = false
  if (sb) {
    try {
      const { error } = await sb.from('questionnaire_responses').insert(payload)
      if (error) throw error
      submitted = true
    } catch(e) {
      console.error('Supabase submit error:', e)
    }
  }

  if (!submitted) {
    try {
      const existing = JSON.parse(localStorage.getItem('survey_responses') || '[]')
      existing.push(payload)
      localStorage.setItem('survey_responses', JSON.stringify(existing))
    } catch(e) {}
  }

  showPage('page-thanks')
  btn.disabled = false
  btn.textContent = '提交'
}

// ===== Init =====
showPage('page-opening')
</script>
</body>
</html>
