<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>独居动物鉴定所 · 管理后台</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  min-height: 100vh;
  background: #f0f2f5;
  color: #1a1a2e;
}

/* Password Gate */
.gate {
  position: fixed; top: 0; left: 0; width: 100%; height: 100%;
  background: #1a1a2e;
  display: flex; align-items: center; justify-content: center;
  z-index: 999;
}
.gate.hidden { display: none; }
.gate-box {
  background: #fff;
  border-radius: 20px;
  padding: 36px 28px;
  width: 320px;
  text-align: center;
  box-shadow: 0 20px 60px rgba(0,0,0,0.3);
}
.gate-box h2 { font-size: 22px; margin-bottom: 8px; }
.gate-box p { font-size: 13px; color: #888; margin-bottom: 20px; }
.gate-box input {
  width: 100%;
  padding: 12px 16px;
  border-radius: 12px;
  border: 2px solid #e0e0e0;
  font-size: 15px;
  outline: none;
  text-align: center;
  transition: border-color 0.2s;
}
.gate-box input:focus { border-color: #667eea; }
.gate-box button {
  width: 100%;
  margin-top: 12px;
  padding: 12px;
  border-radius: 12px;
  border: none;
  background: linear-gradient(135deg, #667eea, #764ba2);
  color: #fff;
  font-size: 16px;
  font-weight: 600;
  cursor: pointer;
  transition: opacity 0.2s;
}
.gate-box button:hover { opacity: 0.9; }
.gate-err { color: #e74c3c; font-size: 13px; margin-top: 8px; min-height: 20px; }

/* Header */
.header {
  background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
  color: #fff;
  padding: 20px 28px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 12px;
}
.header h1 { font-size: 22px; font-weight: 700; }
.header .actions { display: flex; gap: 10px; align-items: center; }
.header button {
  padding: 8px 18px;
  border-radius: 20px;
  border: 1px solid rgba(255,255,255,0.3);
  background: transparent;
  color: #fff;
  font-size: 13px;
  cursor: pointer;
  font-family: inherit;
  transition: background 0.2s;
}
.header button:hover { background: rgba(255,255,255,0.1); }
.header .updated { font-size: 12px; color: rgba(255,255,255,0.5); }

/* Container */
.container { max-width: 1200px; margin: 0 auto; padding: 24px 20px 40px; }

/* Stat Cards */
.stat-row {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 16px;
  margin-bottom: 24px;
}
.stat-card {
  background: #fff;
  border-radius: 16px;
  padding: 20px 24px;
  box-shadow: 0 1px 8px rgba(0,0,0,0.06);
}
.stat-card .label { font-size: 13px; color: #888; margin-bottom: 4px; }
.stat-card .value { font-size: 32px; font-weight: 700; }
.stat-card .sub { font-size: 12px; color: #aaa; margin-top: 2px; }

/* Charts */
.chart-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(360px, 1fr));
  gap: 20px;
  margin-bottom: 24px;
}
.chart-card {
  background: #fff;
  border-radius: 16px;
  padding: 20px 24px;
  box-shadow: 0 1px 8px rgba(0,0,0,0.06);
}
.chart-card h3 { font-size: 15px; color: #444; margin-bottom: 14px; }
.chart-wrap { position: relative; width: 100%; max-height: 300px; }
.chart-wrap canvas { max-height: 280px; }

/* Table */
.table-card {
  background: #fff;
  border-radius: 16px;
  padding: 20px 24px;
  box-shadow: 0 1px 8px rgba(0,0,0,0.06);
  overflow-x: auto;
}
.table-card h3 { font-size: 15px; color: #444; margin-bottom: 14px; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th, td { text-align: left; padding: 10px 12px; }
th { color: #888; font-weight: 600; border-bottom: 2px solid #f0f0f0; white-space: nowrap; }
td { border-bottom: 1px solid #f5f5f5; color: #555; }
tr:hover td { background: #fafafa; }
.empty { text-align: center; color: #bbb; padding: 40px 0; }

/* Loading */
.loading { text-align: center; padding: 80px 0; color: #999; }
.spinner {
  display: inline-block;
  width: 36px; height: 36px;
  border: 3px solid #e9ecef;
  border-top-color: #667eea;
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
  margin-bottom: 12px;
}
@keyframes spin { to { transform: rotate(360deg); } }
.error { text-align: center; padding: 60px 0; color: #e74c3c; }

@media (max-width: 520px) {
  .chart-grid { grid-template-columns: 1fr; }
  .header { padding: 16px 20px; }
  .header h1 { font-size: 18px; }
}
</style>
</head>
<body>

<!-- Password Gate -->
<div class="gate" id="gate">
  <div class="gate-box">
    <h2>🔒 管理后台</h2>
    <p>请输入访问密码</p>
    <input type="password" id="pwdInput" placeholder="密码" onkeydown="if(event.key==='Enter')checkPwd()">
    <button onclick="checkPwd()">进入</button>
    <div class="gate-err" id="gateErr"></div>
  </div>
</div>

<!-- Dashboard (hidden until auth) -->
<div id="dashboard" style="display:none">
  <div class="header">
    <h1>🦄 独居动物鉴定所 · 管理后台</h1>
    <div class="actions">
      <span class="updated" id="updatedAt"></span>
      <button onclick="loadData()">🔄 刷新</button>
      <button onclick="logout()">退出</button>
    </div>
  </div>

  <div class="container">
    <div class="stat-row">
      <div class="stat-card">
        <div class="label">总提交数</div>
        <div class="value" id="totalCount" style="color:#667eea">-</div>
        <div class="sub">所有鉴定记录</div>
      </div>
      <div class="stat-card">
        <div class="label">今日新增</div>
        <div class="value" id="todayCount" style="color:#10b981">-</div>
        <div class="sub" id="todayDate"></div>
      </div>
      <div class="stat-card">
        <div class="label">平均得分</div>
        <div class="value" id="avgScore" style="color:#f59e0b">-</div>
        <div class="sub">满分 40</div>
      </div>
      <div class="stat-card">
        <div class="label">最多结果</div>
        <div class="value" id="topResult" style="color:#ec4899">-</div>
        <div class="sub" id="topResultPct"></div>
      </div>
    </div>

    <div class="chart-grid">
      <div class="chart-card">
        <h3>结果类型分布</h3>
        <div class="chart-wrap"><canvas id="chartResultType"></canvas></div>
      </div>
      <div class="chart-card">
        <h3>分数段分布</h3>
        <div class="chart-wrap"><canvas id="chartScoreDist"></canvas></div>
      </div>
      <div class="chart-card">
        <h3>年龄分布</h3>
        <div class="chart-wrap"><canvas id="chartAge"></canvas></div>
      </div>
      <div class="chart-card">
        <h3>性别比例</h3>
        <div class="chart-wrap"><canvas id="chartGender"></canvas></div>
      </div>
    </div>

    <div class="chart-card" style="margin-bottom:24px">
      <h3>每日提交趋势</h3>
      <div class="chart-wrap" style="max-height:300px"><canvas id="chartTimeline"></canvas></div>
    </div>

    <div class="table-card">
      <h3>最近提交记录 <span style="color:#aaa;font-weight:400;font-size:12px">（最新50条）</span></h3>
      <div id="dataTable"></div>
    </div>
  </div>
</div>

<script>
const ADMIN_PASSWORD = 'admin888'
const SUPABASE_URL = 'https://aojysbbjethuqggvzivi.supabase.co'
const SUPABASE_ANON_KEY = 'YOUR_ANON_KEY_HERE'

let sb = null
try { sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) } catch(e) {}

// ===== Auth =====
function checkPwd() {
  const input = document.getElementById('pwdInput').value
  if (input === ADMIN_PASSWORD) {
    document.getElementById('gate').classList.add('hidden')
    document.getElementById('dashboard').style.display = 'block'
    document.getElementById('todayDate').textContent = new Date().toLocaleDateString('zh-CN')
    loadData()
  } else {
    document.getElementById('gateErr').textContent = '密码错误，请重试'
    document.getElementById('pwdInput').value = ''
  }
}

function logout() {
  document.getElementById('gate').classList.remove('hidden')
  document.getElementById('dashboard').style.display = 'none'
  document.getElementById('pwdInput').value = ''
}

// ===== Load Data =====
async function loadData() {
  showLoading()

  let rows = []
  // Try Supabase
  if (sb) {
    try {
      const { data, error } = await sb.from('questionnaire_responses').select('*').order('created_at', { ascending: false })
      if (!error && data) rows = data
    } catch(e) { console.warn('Supabase read error:', e) }
  }

  // Fallback: localStorage
  if (rows.length === 0) {
    try {
      rows = JSON.parse(localStorage.getItem('survey_responses') || '[]')
    } catch(e) {}
  }

  renderAll(rows)
}

function showLoading() {
  document.getElementById('dataTable').innerHTML = '<div class="loading"><div class="spinner"></div><div>加载数据中...</div></div>'
  document.getElementById('totalCount').textContent = '...'
  document.getElementById('todayCount').textContent = '...'
  document.getElementById('avgScore').textContent = '...'
  document.getElementById('topResult').textContent = '...'
}

function renderAll(rows) {
  if (rows.length === 0) {
    document.getElementById('dataTable').innerHTML = '<div class="empty">暂无数据。问卷提交后会自动出现在这里。</div>'
    document.getElementById('totalCount').textContent = '0'
    document.getElementById('todayCount').textContent = '0'
    document.getElementById('avgScore').textContent = '-'
    document.getElementById('topResult').textContent = '-'
    return
  }

  renderStats(rows)
  renderResultTypeChart(rows)
  renderScoreDistChart(rows)
  renderAgeChart(rows)
  renderGenderChart(rows)
  renderTimeline(rows)
  renderTable(rows)

  document.getElementById('updatedAt').textContent = `更新于 ${new Date().toLocaleTimeString('zh-CN')}`
}

// ===== Stats =====
function renderStats(rows) {
  const now = new Date()
  const todayStart = new Date(now.getFullYear(), now.getMonth(), now.getDate())

  document.getElementById('totalCount').textContent = rows.length
  document.getElementById('todayCount').textContent = rows.filter(r => new Date(r.created_at) >= todayStart).length

  const scores = rows.map(r => r.total_score).filter(s => s != null)
  const avg = scores.length ? (scores.reduce((a,b) => a+b, 0) / scores.length).toFixed(1) : '-'
  document.getElementById('avgScore').textContent = avg

  // Most common result
  const typeMap = {}
  rows.forEach(r => {
    const t = r.result_title || r.result_type || '未知'
    typeMap[t] = (typeMap[t] || 0) + 1
  })
  const top = Object.entries(typeMap).sort((a,b) => b[1] - a[1])[0]
  if (top) {
    document.getElementById('topResult').textContent = top[0]
    document.getElementById('topResultPct').textContent = `${Math.round(top[1]/rows.length*100)}%`
  }
}

// ===== Charts =====
const COLORS = ['#667eea', '#10b981', '#f59e0b', '#ec4899', '#3b82f6', '#ef4444', '#8b5cf6', '#14b8a6']
const RESULT_COLORS = { '独居神兽': '#667eea', '佛系岛民': '#10b981', '薛定谔的独居者': '#f59e0b', '社交孤儿': '#ec4899' }

function destroyChart(id) { const old = Chart.getChart(id); if (old) old.destroy() }

function renderResultTypeChart(rows) {
  const map = {}
  rows.forEach(r => {
    const t = r.result_title || r.result_type || '未知'
    map[t] = (map[t] || 0) + 1
  })
  const labels = Object.keys(map)
  const values = Object.values(map)
  const colors = labels.map(l => RESULT_COLORS[l] || '#999')

  destroyChart('chartResultType')
  new Chart(document.getElementById('chartResultType'), {
    type: 'doughnut',
    data: {
      labels,
      datasets: [{ data: values, backgroundColor: colors, borderWidth: 2, borderColor: '#fff' }]
    },
    options: {
      responsive: true, maintainAspectRatio: true,
      plugins: {
        legend: { position: 'bottom', labels: { padding: 14, usePointStyle: true, font: { size: 12 } } },
        tooltip: { callbacks: { label: ctx => { const t = ctx.dataset.data.reduce((a,b)=>a+b,0); return ` ${ctx.label}: ${ctx.parsed} 人 (${Math.round(ctx.parsed/t*100)}%)` } } }
      }
    }
  })
}

function renderScoreDistChart(rows) {
  const buckets = { '8-15': 0, '16-23': 0, '24-31': 0, '32-40': 0 }
  rows.forEach(r => {
    const s = r.total_score || 0
    if (s <= 15) buckets['8-15']++
    else if (s <= 23) buckets['16-23']++
    else if (s <= 31) buckets['24-31']++
    else buckets['32-40']++
  })

  destroyChart('chartScoreDist')
  new Chart(document.getElementById('chartScoreDist'), {
    type: 'bar',
    data: {
      labels: Object.keys(buckets),
      datasets: [{
        label: '人数',
        data: Object.values(buckets),
        backgroundColor: ['#ec4899','#f59e0b','#10b981','#667eea'],
        borderRadius: 8, borderSkipped: false
      }]
    },
    options: {
      responsive: true, maintainAspectRatio: true,
      plugins: { legend: { display: false } },
      scales: { y: { beginAtZero: true, ticks: { stepSize: 1 } } }
    }
  })
}

function renderAgeChart(rows) {
  const map = {}
  rows.forEach(r => {
    const a = r.age || '未填'
    map[a] = (map[a] || 0) + 1
  })
  const labels = Object.keys(map)
  const values = Object.values(map)

  destroyChart('chartAge')
  new Chart(document.getElementById('chartAge'), {
    type: 'doughnut',
    data: {
      labels,
      datasets: [{ data: values, backgroundColor: COLORS.slice(0, labels.length), borderWidth: 2, borderColor: '#fff' }]
    },
    options: {
      responsive: true, maintainAspectRatio: true,
      plugins: { legend: { position: 'bottom', labels: { padding: 14, usePointStyle: true, font: { size: 11 } } } }
    }
  })
}

function renderGenderChart(rows) {
  const map = {}
  rows.forEach(r => {
    const g = r.gender || '未填'
    map[g] = (map[g] || 0) + 1
  })

  destroyChart('chartGender')
  new Chart(document.getElementById('chartGender'), {
    type: 'doughnut',
    data: {
      labels: Object.keys(map),
      datasets: [{ data: Object.values(map), backgroundColor: ['#3b82f6', '#ec4899', '#ccc'], borderWidth: 2, borderColor: '#fff' }]
    },
    options: {
      responsive: true, maintainAspectRatio: true,
      plugins: { legend: { position: 'bottom', labels: { padding: 14, usePointStyle: true, font: { size: 12 } } } }
    }
  })
}

function renderTimeline(rows) {
  if (rows.length === 0) return
  const byDate = {}
  rows.forEach(r => {
    const d = new Date(r.created_at).toLocaleDateString('zh-CN')
    byDate[d] = (byDate[d] || 0) + 1
  })
  const sorted = Object.entries(byDate).sort((a,b) => new Date(a[0]) - new Date(b[0]))
  const recent = sorted.slice(-30)

  destroyChart('chartTimeline')
  new Chart(document.getElementById('chartTimeline'), {
    type: 'bar',
    data: {
      labels: recent.map(e => e[0]),
      datasets: [{
        label: '提交数',
        data: recent.map(e => e[1]),
        backgroundColor: '#667eea',
        borderRadius: 6,
        borderSkipped: false
      }]
    },
    options: {
      responsive: true, maintainAspectRatio: true,
      plugins: { legend: { display: false } },
      scales: {
        y: { beginAtZero: true, ticks: { stepSize: 1 }, grid: { color: '#f0f0f0' } },
        x: { ticks: { maxRotation: 45, font: { size: 10 } }, grid: { display: false } }
      }
    }
  })
}

// ===== Table =====
function renderTable(rows) {
  const recent = rows.slice(0, 50)
  if (recent.length === 0) {
    document.getElementById('dataTable').innerHTML = '<div class="empty">暂无记录</div>'
    return
  }

  let html = `<table><thead><tr>
    <th>时间</th><th>结果</th><th>得分</th><th>年龄</th><th>城市</th><th>性别</th><th>答题详情</th>
  </tr></thead><tbody>`

  recent.forEach(r => {
    const ansSummary = r.answers
      ? (Array.isArray(r.answers) ? r.answers.map((a, i) => a ? `Q${i+1}:${a.letter || (a.letters||[]).join(',')}` : '').filter(Boolean).join(' ') : '')
      : ''
    html += `<tr>
      <td style="white-space:nowrap">${new Date(r.created_at).toLocaleString('zh-CN')}</td>
      <td><strong>${r.result_title || r.result_type || '-'}</strong></td>
      <td>${r.total_score ?? '-'}</td>
      <td>${r.age || '-'}</td>
      <td>${r.city || '-'}</td>
      <td>${r.gender || '-'}</td>
      <td style="font-size:11px;max-width:250px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${ansSummary}</td>
    </tr>`
  })

  html += '</tbody></table>'
  document.getElementById('dataTable').innerHTML = html
}
</script>
</body>
</html>
