<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>问卷测试页面</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .card {
            background: white;
            border-radius: 32px;
            padding: 32px 24px;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            animation: fadeInUp 0.6s ease-out;
        }
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        h1 {
            font-size: 28px;
            color: #333;
            margin-bottom: 12px;
            text-align: center;
        }
        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 32px;
            font-size: 14px;
        }
        .question {
            margin-bottom: 24px;
        }
        .question-label {
            font-weight: 600;
            color: #333;
            margin-bottom: 12px;
            display: block;
        }
        .option {
            display: flex;
            align-items: center;
            margin-bottom: 12px;
            padding: 12px;
            background: #f8f9fa;
            border-radius: 16px;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .option:hover {
            background: #e9ecef;
            transform: scale(1.01);
        }
        .option input {
            margin-right: 12px;
            width: 20px;
            height: 20px;
            cursor: pointer;
        }
        .option label {
            flex: 1;
            cursor: pointer;
            color: #333;
        }
        button {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 40px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 16px;
        }
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px -5px rgba(102, 126, 234, 0.4);
        }
        button:active {
            transform: translateY(0);
        }
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.8);
            color: white;
            padding: 12px 24px;
            border-radius: 40px;
            font-size: 14px;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
            z-index: 1000;
        }
        .toast.show {
            opacity: 1;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>✨ 问卷测试</h1>
        <div class="subtitle">这是一个部署连通性测试页面</div>
        
        <div class="question">
            <div class="question-label">1. 您对我们产品的整体印象如何？</div>
            <div class="option">
                <input type="radio" name="q1" value="非常满意" id="q1_a">
                <label for="q1_a">非常满意</label>
            </div>
            <div class="option">
                <input type="radio" name="q1" value="满意" id="q1_b">
                <label for="q1_b">满意</label>
            </div>
            <div class="option">
                <input type="radio" name="q1" value="一般" id="q1_c">
                <label for="q1_c">一般</label>
            </div>
            <div class="option">
                <input type="radio" name="q1" value="不满意" id="q1_d">
                <label for="q1_d">不满意</label>
            </div>
        </div>
        
        <div class="question">
            <div class="question-label">2. 您会推荐给朋友吗？</div>
            <div class="option">
                <input type="radio" name="q2" value="一定会" id="q2_a">
                <label for="q2_a">一定会</label>
            </div>
            <div class="option">
                <input type="radio" name="q2" value="可能会" id="q2_b">
                <label for="q2_b">可能会</label>
            </div>
            <div class="option">
                <input type="radio" name="q2" value="不确定" id="q2_c">
                <label for="q2_c">不确定</label>
            </div>
        </div>
        
        <button onclick="submitTest()">📮 提交测试</button>
    </div>
    
    <div id="toast" class="toast">✅ 提交成功！数据已记录</div>

    <script>
        function submitTest() {
            // 获取选中的值
            const q1 = document.querySelector('input[name="q1"]:checked');
            const q2 = document.querySelector('input[name="q2"]:checked');
            
            if (!q1 || !q2) {
                alert('请完整回答所有问题');
                return;
            }
            
            // 构造提交数据
            const data = {
                q1: q1.value,
                q2: q2.value,
                timestamp: new Date().toISOString(),
                userAgent: navigator.userAgent
            };
            
            // 显示提交成功的提示（模拟提交，暂不连接真实数据库）
            console.log('提交的数据：', data);
            
            const toast = document.getElementById('toast');
            toast.classList.add('show');
            setTimeout(() => {
                toast.classList.remove('show');
            }, 2000);
            
            // 可选：清空选中状态（如果需要）
            // q1.checked = false;
            // q2.checked = false;
        }
    </script>
</body>
</html>
