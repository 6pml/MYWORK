<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>问卷管理后台</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            min-height: 100vh;
            background: #f5f6fa;
            color: #333;
        }

        /* ---- header ---- */
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 24px 32px;
            box-shadow: 0 4px 20px rgba(102, 126, 234, 0.25);
        }
        .header h1 {
            font-size: 24px;
            font-weight: 700;
        }
        .header .meta {
            font-size: 13px;
            opacity: 0.8;
            margin-top: 4px;
        }

        /* ---- container ---- */
        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 24px 20px 40px;
        }

        /* ---- stat cards ---- */
        .stat-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 16px;
            margin-bottom: 28px;
        }
        .stat-card {
            background: white;
            border-radius: 16px;
            padding: 20px 24px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.06);
            transition: transform 0.2s;
        }
        .stat-card:hover {
            transform: translateY(-2px);
        }
        .stat-card .label {
            font-size: 13px;
            color: #888;
            margin-bottom: 6px;
        }
        .stat-card .value {
            font-size: 32px;
            font-weight: 700;
            color: #667eea;
        }
        .stat-card .sub {
            font-size: 12px;
            color: #aaa;
            margin-top: 4px;
        }

        /* ---- chart grid ---- */
        .chart-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(480px, 1fr));
            gap: 20px;
            margin-bottom: 24px;
        }
        .chart-card {
            background: white;
            border-radius: 16px;
            padding: 20px 24px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.06);
        }
        .chart-card h3 {
            font-size: 16px;
            color: #444;
            margin-bottom: 16px;
        }
        .chart-wrap {
            position: relative;
            width: 100%;
            max-height: 280px;
        }
        .chart-wrap canvas {
            max-height: 260px;
        }

        /* ---- table ---- */
        .table-card {
            background: white;
            border-radius: 16px;
            padding: 20px 24px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.06);
            margin-bottom: 24px;
        }
        .table-card h3 {
            font-size: 16px;
            color: #444;
            margin-bottom: 16px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            text-align: left;
            padding: 10px 12px;
            font-size: 14px;
        }
        th {
            color: #888;
            font-weight: 600;
            border-bottom: 2px solid #f0f0f0;
        }
        td {
            border-bottom: 1px solid #f5f5f5;
            color: #555;
        }
        tr:last-child td {
            border-bottom: none;
        }
        .empty {
            text-align: center;
            color: #bbb;
            padding: 40px 0;
        }

        /* ---- loading / error ---- */
        .loading {
            text-align: center;
            padding: 80px 0;
            color: #999;
        }
        .loading .spinner {
            display: inline-block;
            width: 36px;
            height: 36px;
            border: 3px solid #e9ecef;
            border-top-color: #667eea;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-bottom: 12px;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .error {
            text-align: center;
            padding: 60px 0;
            color: #e74c3c;
        }
        .refresh-bar {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            margin-bottom: 20px;
            gap: 12px;
        }
        .refresh-btn {
            padding: 8px 20px;
            background: white;
            border: 1px solid #ddd;
            border-radius: 20px;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s;
            font-family: inherit;
            color: #666;
        }
        .refresh-btn:hover {
            border-color: #667eea;
            color: #667eea;
        }
        .updated-at {
            font-size: 12px;
            color: #bbb;
        }

        @media (max-width: 520px) {
            .chart-grid {
                grid-template-columns: 1fr;
            }
            .header {
                padding: 20px;
            }
            .header h1 {
                font-size: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>问卷管理后台</h1>
        <div class="meta">产品调研数据统计</div>
    </div>

    <div class="container">
        <div class="refresh-bar">
            <span class="updated-at" id="updatedAt"></span>
            <button class="refresh-btn" onclick="loadData()">刷新数据</button>
        </div>

        <div class="stat-row">
            <div class="stat-card">
                <div class="label">总提交数</div>
                <div class="value" id="totalCount">-</div>
                <div class="sub">所有问卷记录</div>
            </div>
            <div class="stat-card">
                <div class="label">今日新增</div>
                <div class="value" id="todayCount">-</div>
                <div class="sub" id="todayDate"></div>
            </div>
            <div class="stat-card">
                <div class="label">本周新增</div>
                <div class="value" id="weekCount">-</div>
                <div class="sub">最近7天</div>
            </div>
            <div class="stat-card">
                <div class="label">Q5 建议数</div>
                <div class="value" id="q5Count">-</div>
                <div class="sub">填写了建议的问卷</div>
            </div>
        </div>

        <div class="chart-grid" id="charts">
            <div class="chart-card">
                <h3>Q1 · 整体印象</h3>
                <div class="chart-wrap"><canvas id="chart_q1"></canvas></div>
            </div>
            <div class="chart-card">
                <h3>Q2 · 推荐意愿</h3>
                <div class="chart-wrap"><canvas id="chart_q2"></canvas></div>
            </div>
            <div class="chart-card">
                <h3>Q3 · 最喜欢方面</h3>
                <div class="chart-wrap"><canvas id="chart_q3"></canvas></div>
            </div>
            <div class="chart-card">
                <h3>Q4 · 需改进地方</h3>
                <div class="chart-wrap"><canvas id="chart_q4"></canvas></div>
            </div>
        </div>

        <div class="chart-card" style="margin-bottom:24px">
            <h3>每日提交趋势</h3>
            <div class="chart-wrap" style="max-height:300px"><canvas id="chart_timeline"></canvas></div>
        </div>

        <div class="table-card">
            <h3>Q5 · 用户建议 <span style="color:#aaa;font-weight:400;font-size:13px">（最近20条）</span></h3>
            <div id="q5Table"></div>
        </div>
    </div>

    <script type="module">
        const COLORS = ['#667eea', '#a78bfa', '#f59e0b', '#10b981', '#ef4444', '#3b82f6', '#ec4899', '#14b8a6']

        function chartColors(count) {
            return COLORS.slice(0, count)
        }

        window.loadData = loadData
        loadData()

        async function loadData() {
            const container = document.getElementById('charts')
            container.innerHTML = '<div class="loading"><div class="spinner"></div><div>加载数据中...</div></div>'

            let data
            try {
                const res = await fetch('/api/stats')
                if (!res.ok) {
                    const err = await res.json().catch(() => ({}))
                    throw new Error(err.error || `HTTP ${res.status}`)
                }
                data = await res.json()
            } catch (e) {
                container.innerHTML = `<div class="error">加载失败：${e.message}<br><small style="color:#999">请确认 Edge Function 已部署且环境变量已配置</small></div>`
                return
            }

            // Restore chart DOM
            container.innerHTML = `
                <div class="chart-card"><h3>Q1 · 整体印象</h3><div class="chart-wrap"><canvas id="chart_q1"></canvas></div></div>
                <div class="chart-card"><h3>Q2 · 推荐意愿</h3><div class="chart-wrap"><canvas id="chart_q2"></canvas></div></div>
                <div class="chart-card"><h3>Q3 · 最喜欢方面</h3><div class="chart-wrap"><canvas id="chart_q3"></canvas></div></div>
                <div class="chart-card"><h3>Q4 · 需改进地方</h3><div class="chart-wrap"><canvas id="chart_q4"></canvas></div></div>
            `

            renderStats(data)
            renderCharts(data)
            renderTimeline(data)
            renderQ5Table(data)

            const now = new Date()
            document.getElementById('updatedAt').textContent =
                `更新于 ${now.toLocaleTimeString('zh-CN')}`
            document.getElementById('todayDate').textContent = now.toLocaleDateString('zh-CN')
        }

        function renderStats(rows) {
            const now = new Date()
            const todayStart = new Date(now.getFullYear(), now.getMonth(), now.getDate())
            const weekStart = new Date(todayStart.getTime() - 7 * 24 * 3600 * 1000)

            document.getElementById('totalCount').textContent = rows.length
            document.getElementById('todayCount').textContent =
                rows.filter(r => new Date(r.created_at) >= todayStart).length
            document.getElementById('weekCount').textContent =
                rows.filter(r => new Date(r.created_at) >= weekStart).length
            document.getElementById('q5Count').textContent =
                rows.filter(r => r.q5 && r.q5.trim()).length
        }

        function countValues(rows, field) {
            const map = {}
            rows.forEach(r => {
                const v = r[field] || '(未填)'
                map[v] = (map[v] || 0) + 1
            })
            return map
        }

        function destroyChart(id) {
            const old = Chart.getChart(id)
            if (old) old.destroy()
        }

        function renderCharts(rows) {
            const questions = [
                { field: 'q1', id: 'chart_q1' },
                { field: 'q2', id: 'chart_q2' },
                { field: 'q3', id: 'chart_q3' },
                { field: 'q4', id: 'chart_q4' }
            ]

            questions.forEach(({ field, id }) => {
                const counts = countValues(rows, field)
                const labels = Object.keys(counts)
                const values = Object.values(counts)

                destroyChart(id)
                const ctx = document.getElementById(id)
                if (!ctx) return

                new Chart(ctx, {
                    type: 'doughnut',
                    data: {
                        labels,
                        datasets: [{
                            data: values,
                            backgroundColor: chartColors(labels.length),
                            borderWidth: 2,
                            borderColor: '#fff'
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: true,
                        plugins: {
                            legend: {
                                position: 'bottom',
                                labels: {
                                    padding: 16,
                                    usePointStyle: true,
                                    pointStyleWidth: 8,
                                    font: { size: 12 }
                                }
                            },
                            tooltip: {
                                callbacks: {
                                    label: ctx => {
                                        const total = ctx.dataset.data.reduce((a, b) => a + b, 0)
                                        const pct = total ? Math.round(ctx.parsed / total * 100) : 0
                                        return ` ${ctx.label}: ${ctx.parsed} 人 (${pct}%)`
                                    }
                                }
                            }
                        }
                    }
                })
            })
        }

        function renderTimeline(rows) {
            if (rows.length === 0) return

            // Group by date
            const byDate = {}
            rows.forEach(r => {
                const d = new Date(r.created_at).toLocaleDateString('zh-CN')
                byDate[d] = (byDate[d] || 0) + 1
            })

            // Sort by date ascending, take last 30 days
            const sorted = Object.entries(byDate).sort((a, b) => new Date(a[0]) - new Date(b[0]))
            const recent = sorted.slice(-30)

            destroyChart('chart_timeline')
            const ctx = document.getElementById('chart_timeline')
            if (!ctx) return

            new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: recent.map(e => e[0]),
                    datasets: [{
                        label: '提交数',
                        data: recent.map(e => e[1]),
                        backgroundColor: '#667eea',
                        borderRadius: 6,
                        borderSkipped: false
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: true,
                    plugins: {
                        legend: { display: false }
                    },
                    scales: {
                        y: {
                            beginAtZero: true,
                            ticks: { stepSize: 1, font: { size: 11 } },
                            grid: { color: '#f0f0f0' }
                        },
                        x: {
                            ticks: { font: { size: 10 }, maxRotation: 45 },
                            grid: { display: false }
                        }
                    }
                }
            })
        }

        function renderQ5Table(rows) {
            const container = document.getElementById('q5Table')
            const withQ5 = rows.filter(r => r.q5 && r.q5.trim()).slice(0, 20)

            if (withQ5.length === 0) {
                container.innerHTML = '<div class="empty">暂无建议数据</div>'
                return
            }

            container.innerHTML = `
                <table>
                    <thead><tr><th style="width:160px">提交时间</th><th>建议内容</th></tr></thead>
                    <tbody>
                        ${withQ5.map(r => `
                            <tr>
                                <td>${new Date(r.created_at).toLocaleString('zh-CN')}</td>
                                <td>${escapeHtml(r.q5)}</td>
                            </tr>
                        `).join('')}
                    </tbody>
                </table>
            `
        }

        function escapeHtml(str) {
            const div = document.createElement('div')
            div.textContent = str
            return div.innerHTML
        }
    </script>
</body>
</html>
